name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: provider_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/provider_hub
        run: npm run db:migrate

      - name: Run E2E Tests
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/provider_hub
        run: npm run test:e2e

      - name: Build Application
        run: npm run build
